services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_codereview}
      POSTGRES_USER: ${POSTGRES_USER:-ai_codereview}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_codereview}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_codereview}
      ARTIFACT_ROOT: /artifacts
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: '["http://localhost:5173"]'
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_GENERATION_MODEL: ${DEEPSEEK_GENERATION_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      GITHUB_SOURCE_TOKEN: ${GITHUB_SOURCE_TOKEN:-}
    ports:
      - "8000:8000"
    volumes:
      - artifact-volume:/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://localhost:8000/api/v1/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 6

  worker:
    build: ../backend
    command: ["python", "-m", "app.worker.main"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_codereview}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_codereview}
      ARTIFACT_ROOT: /artifacts
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      WORKER_ID: compose-worker
      GENERATION_PROVIDER: ${GENERATION_PROVIDER:-deepseek}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_GENERATION_MODEL: ${DEEPSEEK_GENERATION_MODEL:-deepseek-v4-flash}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_GENERATION_MODEL: ${GEMINI_GENERATION_MODEL:-gemini-2.5-flash}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      GITHUB_SOURCE_TOKEN: ${GITHUB_SOURCE_TOKEN:-}
    volumes:
      - artifact-volume:/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build: ../backend
    command: ["alembic", "upgrade", "head"]
    profiles: ["migrate"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ai_codereview}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ai_codereview}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ../frontend
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  artifact-volume:
