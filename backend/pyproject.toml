[project]
name = "ai-codereview-backend"
version = "0.1.0"
description = "AI-CodeReview v1 backend"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "PyJWT>=2.10,<3.0",
  "python-multipart>=0.0.18,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.14,<2.0",
  "pgvector>=0.3,<1.0",
  "langgraph>=0.2,<1.0",
  "google-genai>=1.0,<2.0",
  "beautifulsoup4>=4.12,<5.0",
  "openpyxl>=3.1,<4.0",
  "Pillow>=10.4,<12.0",
  "pypdf>=5.0,<6.0",
  "pytesseract>=0.3.13,<1.0",
  "python-docx>=1.1,<2.0",
  "python-pptx>=1.0,<2.0",
  "PyYAML>=6.0,<7.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
